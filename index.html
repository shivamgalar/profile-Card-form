<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Gilroy, sans-serif;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            background-color: #fffafa;
            padding: 50px;

        }

        input {
            display: block;
        }



        #btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        #btn:hover {
            background-color: #0056b3;


        }

        .card {
            max-width: 300px;
            margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 2px solid #e3e3e3;
        }

        .card p {
            margin-top: 20px;
            font-size: 12px;

        }

        .card h5 {
            margin-top: 5px;
        }



        .profile {
            height: 50px;
            width: 50px;
            background-color: aqua;
            border-radius: 50%;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profile pic ">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="info ">
            <input type="Submit">
        </form>

       

    </div>
    <script src="script.js"></script>
</body>
</body>

</html>
